<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowing</title>
<style>
  :root {
    --bg: #faf8f5; --fg: #1d1b19; --muted: #7a746c; --card: #fff; --line: #e6e1da;
    --accent: #c2410c; --accent-soft: #fdeee4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --fg: #ece8e2; --muted: #9a938a; --card: #211f1c; --line: #34302b;
            --accent: #fb923c; --accent-soft: #3a2518; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--line);
                     border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  button, select { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
                   background: var(--card); color: var(--fg); cursor: pointer; }
  .filebtn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .filebtn:hover { border-color: var(--accent); }
  .filebtn.busy { opacity: .5; pointer-events: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  #library a { display: block; padding: 6px 0; color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
  #library a:last-child { border-bottom: 0; }
  #library a:hover { color: var(--accent); }
  #current { font-size: 28px; line-height: 1.6; min-height: 3.2em; margin: 8px 0 16px; text-align: center;
             display: flex; align-items: center; justify-content: center; }
  #current.hidden-text { color: transparent; text-shadow: 0 0 14px var(--muted); user-select: none; }
  .controls { justify-content: center; }
  .controls button { min-width: 64px; font-size: 18px; }
  .settings { justify-content: center; margin-top: 12px; gap: 16px; font-size: 13px; }
  .settings label { display: flex; gap: 6px; align-items: center; }
  .settings select, .settings input[type=number] { padding: 4px 6px; font-size: 13px; }
  .settings input[type=number] { width: 56px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg); }
  #status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: middle; }
  #status-dot.playing { background: var(--accent); }
  #status-dot.shadow { background: #16a34a; }
  ol#list { padding-left: 0; list-style: none; margin: 0; max-height: 45vh; overflow: auto; }
  ol#list li { padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 10px; }
  ol#list li .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  ol#list li:hover { background: var(--bg); }
  ol#list li.active { background: var(--accent-soft); }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  #workspace { display: grid; gap: 0 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1000px) {
    #workspace { grid-template-columns: minmax(0, 1fr) 380px; }
    #panel { position: sticky; top: 0; max-height: calc(100vh - 16px); overflow: auto; }
  }
  #panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 8px; }
  #panel h2:first-child { margin-top: 0; }
  #panel-body.blurred { filter: blur(6px); user-select: none; pointer-events: none; }
  #furi { font-size: 22px; line-height: 2.1; }
  rt { font-size: 55%; color: var(--muted); }
  .word { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .word:last-child { border-bottom: 0; }
  .w-base { font-size: 17px; font-weight: 600; }
  .w-read { color: var(--muted); margin-left: 6px; }
  .w-pos { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .w-gloss { font-size: 13px; margin-top: 2px; }
  .g { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .g:last-child { border-bottom: 0; }
  .lvl { font-size: 11px; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .err { color: #dc2626; font-size: 13px; }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>シャドーイング · Shadowing</h1>

  <form id="form" class="row">
    <input type="text" id="url" placeholder="YouTube URL (e.g. JLPT N4 listening)" autocomplete="off">
    <button class="primary" id="go">Transcribe</button>
    <span class="muted">or</span>
    <label class="filebtn" id="filebtn">Open file…
      <input type="file" id="file" accept="video/*,audio/*,.mkv" hidden>
    </label>
  </form>

  <div id="job" class="card hidden">
    <div class="row" style="justify-content:space-between"><b id="job-title">…</b><span class="muted" id="job-status"></span></div>
    <progress id="job-progress" max="1" value="0"></progress>
    <div class="muted" id="job-preview"></div>
  </div>

  <div id="workspace" class="hidden">
  <div>
  <div id="player" class="card">
    <div class="row" style="justify-content:space-between">
      <b id="title"></b>
      <span class="muted"><span id="status-dot"></span><span id="counter"></span></span>
    </div>
    <div id="current"></div>
    <div class="row controls">
      <button id="prev" title="Previous (←)">⏮</button>
      <button id="play" class="primary" title="Play / replay (Space)">▶</button>
      <button id="next" title="Next (→ / Enter)">⏭</button>
    </div>
    <div class="row settings">
      <label>Speed
        <select id="rate">
          <option>0.5</option><option>0.6</option><option>0.7</option><option>0.75</option>
          <option>0.8</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option>
        </select>
      </label>
      <label>Repeat <input type="number" id="repeat" min="1" max="10" value="1"></label>
      <label><input type="checkbox" id="auto"> Auto-advance</label>
      <label title="Pause after each playback = sentence length × this">Shadow pause ×<input type="number" id="pause" min="0" max="5" step="0.25" value="1.25"></label>
      <label><input type="checkbox" id="showtext" checked> Show text <kbd>T</kbd></label>
      <label><input type="checkbox" id="furigana"> Furigana <kbd>F</kbd></label>
    </div>
    <p class="muted" style="text-align:center;margin:12px 0 0">
      <kbd>Space</kbd> play/replay · <kbd>←</kbd>/<kbd>→</kbd> prev/next · <kbd>↑</kbd>/<kbd>↓</kbd> speed · <kbd>Esc</kbd> stop · <kbd>E</kbd> explain
    </p>
    <audio id="audio" preload="auto"></audio>
  </div>

  <div id="list-card" class="card"><ol id="list"></ol></div>
  </div>

  <aside id="panel" class="card">
    <div id="panel-body">
      <h2>Sentence</h2>
      <div id="furi"></div>
      <h2>Words</h2>
      <div id="dict-note" class="muted hidden"></div>
      <div id="words"></div>
      <div id="explain-section" class="hidden">
        <h2>Grammar</h2>
        <button id="explain-btn">Explain grammar</button>
        <div id="explain-out"></div>
      </div>
    </div>
  </aside>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">Library</div>
    <div id="library" class="muted">Nothing transcribed yet.</div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const PAD_BEFORE = 0.12, PAD_AFTER = 0.25; // whisper timestamps are a little tight

let data = null, idx = 0;
let token = 0;           // bumps on every user action; stale timers/loops check it and bail
let pendingTimer = null;

// ---------- settings persistence ----------
const SETTINGS = ["rate", "repeat", "auto", "pause", "showtext", "furigana"];
function saveSettings() {
  const s = {};
  for (const k of SETTINGS) s[k] = $(k).type === "checkbox" ? $(k).checked : $(k).value;
  try { localStorage.setItem("shadow-settings", JSON.stringify(s)); } catch {}
}
function loadSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem("shadow-settings") || "{}"); } catch {}
  for (const k of SETTINGS) if (k in s) $(k).type === "checkbox" ? ($(k).checked = s[k]) : ($(k).value = s[k]);
}
loadSettings();
for (const k of SETTINGS) $(k).addEventListener("change", () => { saveSettings(); render(); });

// ---------- transcription jobs ----------
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("url").value.trim();
  if (!url) return;
  $("go").disabled = true;
  const job = await (await fetch("/api/jobs", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }),
  })).json();
  $("job").classList.remove("hidden");
  poll(job.id);
});

$("file").addEventListener("change", () => {
  const file = $("file").files[0];
  $("file").value = "";
  if (!file) return;
  $("filebtn").classList.add("busy");
  $("job").classList.remove("hidden");
  $("job-title").textContent = file.name;
  $("job-preview").textContent = "";
  // XHR rather than fetch, for upload progress on big video files.
  const xhr = new XMLHttpRequest();
  xhr.open("POST", `/api/upload?name=${encodeURIComponent(file.name)}`);
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    $("job-status").textContent = `uploading ${Math.round((e.loaded / e.total) * 100)}%`;
    $("job-progress").value = e.loaded / e.total;
  };
  xhr.onload = () => {
    if (xhr.status !== 200) return uploadFailed(`upload failed (${xhr.status})`);
    poll(JSON.parse(xhr.responseText).id);
  };
  xhr.onerror = () => uploadFailed("upload failed");
  xhr.send(file);
});

function uploadFailed(msg) {
  $("job-status").textContent = "error";
  $("job-preview").textContent = msg;
  $("filebtn").classList.remove("busy");
}

async function poll(id) {
  const j = await (await fetch(`/api/jobs/${id}`)).json();
  $("job-title").textContent = j.title || "…";
  $("job-status").textContent = j.status + (["transcribing", "downloading"].includes(j.status) ? ` ${Math.round(j.progress * 100)}%` : "");
  $("job-progress").value = j.progress || 0;
  $("job-preview").textContent = j.preview || j.error || "";
  if (j.status === "done") {
    $("go").disabled = false;
    $("filebtn").classList.remove("busy");
    $("job").classList.add("hidden");
    loadLibrary();
    openVideo(j.video_id);
  } else if (j.status === "error") {
    $("go").disabled = false;
    $("filebtn").classList.remove("busy");
  } else {
    setTimeout(() => poll(id), 1000);
  }
}

async function loadLibrary() {
  const items = await (await fetch("/api/library")).json();
  if (!items.length) return;
  $("library").innerHTML = "";
  for (const it of items) {
    const a = document.createElement("a");
    a.href = `#${it.video_id}`;
    a.textContent = `${it.title} (${it.count} sentences)`;
    $("library").append(a);
  }
}

// ---------- player ----------
async function openVideo(vid) {
  stop();
  data = await (await fetch(`/api/transcript/${vid}`)).json();
  audio.src = `/media/${vid}`;
  let saved = 0;
  try { saved = +localStorage.getItem(`shadow-pos-${vid}`) || 0; } catch {}
  idx = Math.min(saved, data.sentences.length - 1);
  $("title").textContent = data.title;
  $("workspace").classList.remove("hidden");
  const list = $("list");
  list.innerHTML = "";
  data.sentences.forEach((s, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="n">${i + 1}</span><span></span>`;
    li.lastChild.textContent = s.text;
    li.onclick = () => go(i);
    list.append(li);
  });
  if (location.hash.slice(1) !== vid) history.replaceState(null, "", `#${vid}`);
  render();
}

function render() {
  if (!data) return;
  const s = data.sentences[idx];
  const a = analyses.get(`${data.video_id}:${idx}`);
  $("current").replaceChildren(...($("furigana").checked && a ? rubyNodes(a.furigana) : [s ? s.text : ""]));
  $("current").classList.toggle("hidden-text", !$("showtext").checked);
  $("panel-body").classList.toggle("blurred", !$("showtext").checked);
  loadPanel();
  $("counter").textContent = `${idx + 1} / ${data.sentences.length}`;
  $("list").querySelectorAll("li").forEach((li, i) => li.classList.toggle("active", i === idx));
  $("list").children[idx]?.scrollIntoView({ block: "nearest" });
  try { localStorage.setItem(`shadow-pos-${data.video_id}`, idx); } catch {}
}

// ---------- side panel: dictionary breakdown + grammar explanations ----------
let cfg = {};
const analyses = new Map();      // "vid:idx" -> analysis
let panelKey = null;

fetch("/api/config").then((r) => r.json()).then((c) => { cfg = c; panelKey = null; render(); });

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function rubyNodes(segs) {
  return segs.map(([t, r]) => {
    if (!r) return document.createTextNode(t);
    const ruby = el("ruby", null, t);
    ruby.append(el("rt", null, r));
    return ruby;
  });
}

async function loadPanel() {
  const key = `${data.video_id}:${idx}`;
  if (key === panelKey) return;
  panelKey = key;
  const i = idx;
  $("furi").textContent = data.sentences[i].text;
  $("words").replaceChildren();
  $("explain-out").replaceChildren();
  $("explain-section").classList.toggle("hidden", !cfg.explain || cfg.explain === "off");
  $("explain-btn").textContent = "Explain grammar";
  $("explain-btn").disabled = false;

  let a = analyses.get(key);
  if (!a) {
    const r = await fetch(`/api/analyze/${data.video_id}/${i}`);
    if (!r.ok) return;
    a = await r.json();
    analyses.set(key, a);
  }
  if (panelKey !== key) return;
  if ($("furigana").checked) $("current").replaceChildren(...rubyNodes(a.furigana));
  $("furi").replaceChildren(...rubyNodes(a.furigana));
  renderWords(a);

  const ex = await fetch(`/api/explain/${data.video_id}/${i}`);
  if (ex.ok && panelKey === key) renderExplanation(await ex.json());
}

function renderWords(a) {
  const notes = {
    missing: "No dictionary loaded: add the JMdict file to data/dict/ for English meanings (see README).",
    building: "Building the dictionary index… meanings will appear shortly.",
  };
  const note = notes[a.dictionary] || (a.dictionary.startsWith("error") ? `Dictionary ${a.dictionary}` : "");
  $("dict-note").textContent = note;
  $("dict-note").classList.toggle("hidden", !note);
  if (a.dictionary === "building") setTimeout(() => { analyses.delete(panelKey); panelKey = null; render(); }, 5000);

  $("words").replaceChildren(...a.words.map((w) => {
    const row = el("div", "word");
    const head = el("div");
    head.append(el("span", "w-base", w.base));
    if (w.reading) head.append(el("span", "w-read", w.reading));
    head.append(el("span", "w-pos", w.pos));
    row.append(head);
    if (w.dict) row.append(el("div", "w-gloss", w.dict.senses.map((g, n) => `${n + 1}. ${g.join("; ")}`).join("   ")));
    return row;
  }));
}

function renderExplanation(x) {
  const out = [];
  out.push(el("p", null, x.translation));
  for (const g of x.grammar) {
    const d = el("div", "g");
    const h = el("div");
    h.append(el("b", null, g.pattern));
    if (g.level && g.level !== "-") h.append(el("span", "lvl", g.level));
    d.append(h, el("div", null, g.explanation), el("div", "muted", g.in_this_sentence));
    out.push(d);
  }
  if (x.vocab.length) {
    out.push(el("h2", null, "In this context"));
    for (const v of x.vocab) {
      const d = el("div", "g");
      d.append(el("b", null, v.word), el("span", "w-read", v.reading), el("div", null, v.meaning));
      out.push(d);
    }
  }
  if (x.notes) { out.push(el("h2", null, "Notes")); out.push(el("p", null, x.notes)); }
  out.push(el("div", "muted", x._model || ""));
  $("explain-out").replaceChildren(...out);
  $("explain-btn").textContent = "Regenerate";
}

async function explainCurrent() {
  if (!data || !cfg.explain || cfg.explain === "off" || $("explain-btn").disabled) return;
  const key = panelKey, i = idx;
  $("explain-btn").disabled = true;
  $("explain-btn").textContent = "Explaining…";
  try {
    const r = await fetch(`/api/explain/${data.video_id}/${i}`, { method: "POST" });
    const body = await r.json();
    if (panelKey !== key) return;
    if (!r.ok) {
      $("explain-out").replaceChildren(el("p", "err", body.detail || `Error ${r.status}`));
      $("explain-btn").textContent = "Try again";
    } else {
      renderExplanation(body);
    }
  } catch (e) {
    if (panelKey === key) $("explain-out").replaceChildren(el("p", "err", String(e)));
  } finally {
    if (panelKey === key) $("explain-btn").disabled = false;
  }
}
$("explain-btn").onclick = () => explainCurrent();

function setDot(state) { $("status-dot").className = state || ""; }

function stop() {
  token++;
  clearTimeout(pendingTimer);
  audio.pause();
  setDot();
}

function go(i) {
  if (!data) return;
  idx = Math.max(0, Math.min(i, data.sentences.length - 1));
  render();
  play();
}

// Play the current sentence `repeat` times, leaving a shadowing pause after each;
// then optionally advance to the next sentence.
async function play() {
  stop();
  const my = token;
  const s = data.sentences[idx];
  const rate = +$("rate").value;
  const repeats = Math.max(1, +$("repeat").value || 1);
  const pauseMs = ((s.end - s.start) / rate) * (+$("pause").value || 0) * 1000;

  for (let r = 0; r < repeats; r++) {
    if (!(await playSegment(s, rate, my))) return;
    const lastOfManual = r === repeats - 1 && !$("auto").checked;
    if (lastOfManual) break; // manual mode: just stop and let the user shadow
    setDot("shadow");
    if (!(await wait(pauseMs, my))) return;
  }
  setDot();
  if ($("auto").checked && idx < data.sentences.length - 1) {
    idx++;
    render();
    play();
  }
}

function playSegment(s, rate, my) {
  return new Promise((resolve) => {
    audio.playbackRate = rate;
    audio.currentTime = Math.max(0, s.start - PAD_BEFORE);
    const stopAt = s.end + PAD_AFTER;
    setDot("playing");
    audio.play().catch(() => resolve(false));
    const tick = () => {
      if (token !== my) return resolve(false);
      if (audio.currentTime >= stopAt || audio.ended) {
        audio.pause();
        setDot();
        return resolve(true);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

function wait(ms, my) {
  return new Promise((resolve) => {
    pendingTimer = setTimeout(() => resolve(token === my), ms);
  });
}

function bumpRate(dir) {
  const sel = $("rate");
  sel.selectedIndex = Math.max(0, Math.min(sel.options.length - 1, sel.selectedIndex + dir));
  saveSettings();
}

$("play").onclick = () => play();
$("next").onclick = () => go(idx + 1);
$("prev").onclick = () => go(idx - 1);

// Don't let clicked controls keep focus, or Space/arrows would also act on them.
document.addEventListener("click", (e) => { if (e.target.closest("button")) e.target.closest("button").blur(); });
document.addEventListener("change", (e) => { if (e.target.matches("select, input[type=checkbox]")) e.target.blur(); });

document.addEventListener("keydown", (e) => {
  if (!data || e.target.matches("input[type=text], input[type=number], select")) return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); play(); }
  else if (k === "ArrowRight" || k === "Enter") { e.preventDefault(); go(idx + 1); }
  else if (k === "ArrowLeft") { e.preventDefault(); go(idx - 1); }
  else if (k === "ArrowUp") { e.preventDefault(); bumpRate(1); }
  else if (k === "ArrowDown") { e.preventDefault(); bumpRate(-1); }
  else if (k === "Escape") stop();
  else if (k === "t" || k === "T") { $("showtext").checked = !$("showtext").checked; saveSettings(); render(); }
  else if (k === "f" || k === "F") { $("furigana").checked = !$("furigana").checked; saveSettings(); render(); }
  else if (k === "e" || k === "E") explainCurrent();
});

window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== data?.video_id) openVideo(v); });
loadLibrary();
if (location.hash.length > 1) openVideo(location.hash.slice(1)).catch(() => {});
</script>
</body>
</html>
