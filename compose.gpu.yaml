# Usage: docker compose -f compose.yaml -f compose.gpu.yaml up --build
# Needs the NVIDIA Container Toolkit on the host.
services:
  shadowing:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu24.04
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
